name: Hourly Exchange Levels

on:
  schedule:
    # One OI / active-traders vertex per UTC hour for the Overview sparks.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Its own group: it only writes exchange-levels.json.
  group: exchange-levels
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Install dependencies
        run: npm ci

      - name: Record open interest and active traders
        run: npm run record:levels

      - name: Commit updated levels
        shell: bash
        run: |
          if git diff --quiet -- data/exchange-levels.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-levels.json
          git commit -m "chore: record hourly open interest and active traders"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — syncing with latest main..."
            git fetch origin main
            git reset --soft origin/main
            git add data/exchange-levels.json
            if git diff --cached --quiet; then
              echo "Remote already up to date with our data."
              exit 0
            fi
            git commit -m "chore: record hourly open interest and active traders"
            sleep $((RANDOM % 8 + 3))
          done

          echo "::error::Failed to push exchange levels after 5 attempts."
          exit 1
