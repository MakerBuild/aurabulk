name: Hourly Volume Leaderboard

on:
  schedule:
    # Walk Aura wallets and refresh 14d rolling volume for the Volume tab.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bulk-data
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # Sampling is paced to about 6.5 requests a second to stay under the
    # exchange's rate limit, so ~2,400 wallets is roughly seven minutes of
    # walking before retries.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Install dependencies
        run: npm ci

      - name: Record wallet trading volume
        run: npm run record:volume

      - name: Commit volume leaderboard
        shell: bash
        run: |
          if git diff --quiet -- data/volume-leaderboard.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/volume-leaderboard.json
          git commit -m "chore: record wallet trading volume"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — syncing with latest main..."
            git fetch origin main
            git reset --soft origin/main
            git add data/volume-leaderboard.json
            if git diff --cached --quiet; then
              echo "Remote already up to date with our data."
              exit 0
            fi
            git commit -m "chore: record wallet trading volume"
            sleep $((RANDOM % 8 + 3))
          done

          echo "::error::Failed to push volume leaderboard after 5 attempts."
          exit 1
